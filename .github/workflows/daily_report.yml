name: Daily Report

# گزارش روزانه عملکرد ربات: هر شب ساعت ۲۳:۳۰ ایران (۲۰:۰۰ UTC)
on:
  schedule:
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily report
        env:
          CHANNELS: ${{ secrets.CHANNELS }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python daily_report.py
