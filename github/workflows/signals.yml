name: Signal Scanner

# هر ۵ دقیقه در جلسه ایران (۹-۲۳) اجرا می‌شود.
# توجه: GitHub Actions cron حداقل ۵ دقیقه‌است و ممکن است چند دقیقه تأخیر داشته باشد.
on:
  schedule:
    # ایران 9-23 = UTC 05:30-19:30 → اجرای هر ۵ دقیقه در 05-19 UTC، دوشنبه تا جمعه
    - cron: '*/5 5-19 * * 1-5'
  workflow_dispatch:  # اجرای دستی

permissions:
  contents: write   # برای commit کردن state

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          INTERVAL: '5'
        run: python signal_bot.py

      - name: Commit state (جلوگیری از سیگنال تکراری)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f signal_state.json ]; then
            git add signal_state.json || true
            git commit -m "update signal state [skip ci]" || echo "nothing to commit"
            git push || echo "push skipped"
          fi
